<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OVS Inventory App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='13' fill='%23fbba07'/%3E%3Ctext x='32' y='43' font-family='Arial,Helvetica,sans-serif' font-size='25' font-weight='bold' letter-spacing='0.5' text-anchor='middle' fill='%23001526'%3EOVS%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:dark;
    --navy:#001526; --bg:#0b1422; --panel:rgba(255,255,255,.07); --panel-strong:rgba(255,255,255,.12);
    --ink:#eef4f9; --muted:#93a7ba;
    --accent:#fbba07; --accent-2:#f59e0b; --accent-ink:#1a1300;
    --glow-1:rgba(251,186,7,.32); --glow-2:rgba(56,189,248,.24); --glow-3:rgba(167,139,250,.20);
    --line:rgba(255,255,255,.14); --line-strong:rgba(255,255,255,.26);
    --ok:#34d399; --ok-bg:rgba(52,211,153,.16);
    --warn:#fbbf24; --warn-bg:rgba(251,191,36,.16);
    --bad:#f87171; --bad-bg:rgba(248,113,113,.16);
    --shadow:0 1px 0 rgba(255,255,255,.05) inset, 0 10px 34px -16px rgba(0,0,0,.65);
    --blur:20px;
    --r:14px;
    --ease-out:cubic-bezier(0.23,1,0.32,1);
    --ease-drawer:cubic-bezier(0.32,0.72,0,1);
  }
  *{box-sizing:border-box;-webkit-overflow-scrolling:touch}
  [hidden]{display:none!important}
  html{scroll-behavior:smooth}
  html,body{margin:0;padding:0}
  body{
    font-family:"IBM Plex Sans",system-ui,sans-serif;color:var(--ink);
    background:#070d18;
    min-height:100vh;-webkit-font-smoothing:antialiased;
    position:relative;isolation:isolate;
  }
  button,a,.lcard,.qtile,.deptchip,.hdbtn,.iconbtn,.btn,.del,.resbox .hd{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  @media(prefers-reduced-motion:reduce){ html{scroll-behavior:auto} }
  body::before{
    content:'';position:fixed;inset:-15%;z-index:-1;pointer-events:none;
    background:
      radial-gradient(38% 32% at 14% 6%, var(--glow-1), transparent 70%),
      radial-gradient(34% 30% at 108% 18%, var(--glow-2), transparent 70%),
      radial-gradient(44% 36% at 46% 118%, var(--glow-3), transparent 70%),
      linear-gradient(180deg,#070d18,#0a1424 55%,#0d1830);
    filter:blur(70px) saturate(140%);
  }
  .mono{font-family:"IBM Plex Mono",monospace}
  .cond{font-family:"IBM Plex Sans Condensed",sans-serif}
  a{color:inherit}
  button,input,select,textarea{font:inherit;color:inherit}

  /* shell */
  header.top{
    position:sticky;top:0;z-index:30;background:rgba(6,12,20,.6);color:#fff;
    backdrop-filter:blur(var(--blur)) saturate(160%);-webkit-backdrop-filter:blur(var(--blur)) saturate(160%);
    border-bottom:1px solid rgba(255,255,255,.08);
    display:flex;align-items:center;gap:12px;padding:12px 16px;
    padding-top:max(12px,env(safe-area-inset-top));
  }
  .brand{font-family:"IBM Plex Sans Condensed";font-weight:700;font-size:20px;letter-spacing:.02em;display:flex;align-items:center;gap:10px;flex:none}
  .ovsmark{display:inline-flex;align-items:center;background:linear-gradient(135deg,#ffd873,var(--accent) 55%,var(--accent-2));color:var(--accent-ink);font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:700;font-size:19px;letter-spacing:.04em;padding:3px 9px 4px;border-radius:6px;line-height:1;box-shadow:0 0 18px rgba(251,186,7,.45)}
  .brand small{font-family:"IBM Plex Mono";font-weight:500;font-size:10px;color:#8fa6b3;letter-spacing:.18em;text-transform:uppercase}
  header.top .grow{flex:1;min-width:0}
  .iconbtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);color:#fff;border-radius:8px;padding:9px 12px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;gap:7px;align-items:center;flex:none}
  .iconbtn:hover{background:rgba(255,255,255,.2)}
  .iconbtn .ico{line-height:1}

  nav.tabs{position:sticky;top:0;z-index:20;display:flex;gap:2px;background:rgba(255,255,255,.045);backdrop-filter:blur(var(--blur)) saturate(160%);-webkit-backdrop-filter:blur(var(--blur)) saturate(160%);border-bottom:1px solid var(--line);padding:0 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  nav.tabs::-webkit-scrollbar{display:none}
  nav.tabs a{padding:13px 14px;font-weight:600;font-size:14px;color:var(--muted);text-decoration:none;border-bottom:3px solid transparent;white-space:nowrap;transition:color 140ms ease,border-color 140ms ease;flex:none}
  nav.tabs a.active{color:var(--ink);border-color:var(--accent);text-shadow:0 0 16px rgba(251,186,7,.4)}

  /* narrow phones: header buttons collapse to icon-only so "Go to box" / "N pending" can't
     wrap or push the settings button off-screen; tabs shrink so more of the strip is visible */
  @media(max-width:480px){
    header.top{padding:10px 12px;gap:6px}
    .brand small{display:none}
    .brand{font-size:17px;gap:7px}
    .iconbtn{padding:9px 10px}
    .iconbtn .lbl{display:none}
    nav.tabs a{padding:12px 11px;font-size:13px}
  }

  main{max-width:920px;margin:0 auto;padding:18px 16px 90px}

  /* generic bits */
  .card{background:var(--panel);backdrop-filter:blur(var(--blur)) saturate(160%);-webkit-backdrop-filter:blur(var(--blur)) saturate(160%);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
  .pad{padding:16px}
  h1.page{font-family:"IBM Plex Sans Condensed";font-weight:700;font-size:26px;margin:2px 0 14px;letter-spacing:.01em}
  .sub{color:var(--muted);font-size:13px}
  label.f{display:block;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:0 0 5px}
  input.t,select.t,textarea.t{width:100%;background:rgba(255,255,255,.06);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line-strong);border-radius:8px;padding:11px 12px;font-size:15px;color:var(--ink)}
  /* the dropdown popup is native OS chrome — browsers only partially honor authored colors on
     <option>, so force the light scheme and dark text explicitly rather than fight for a themed
     popup that may silently fall back to unreadable pale-on-white in some engines */
  select.t{color-scheme:light}
  select.t option{background-color:#fff;color:var(--navy)}
  input.t::placeholder,select.t::placeholder,textarea.t::placeholder{color:var(--muted)}
  input.t:focus,select.t:focus,textarea.t:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent;box-shadow:0 0 0 5px rgba(251,186,7,.16)}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row>*{flex:1;min-width:0}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:rgba(255,255,255,.08);color:var(--ink);border:1px solid var(--line-strong);border-radius:8px;padding:12px 16px;font-weight:600;font-size:14px;cursor:pointer;transition:background 140ms ease,filter 140ms ease,transform 130ms var(--ease-out),box-shadow 140ms ease}
  .btn:active{transform:scale(.97)}
  .btn:disabled{opacity:.6;transform:none}
  .btn:hover{background:rgba(255,255,255,.14)}
  .btn.acc{background:linear-gradient(135deg,#ffd873,var(--accent) 55%,var(--accent-2));color:var(--accent-ink);border-color:transparent;box-shadow:0 8px 24px -10px rgba(251,186,7,.65),0 0 0 1px rgba(255,255,255,.12) inset}
  .btn.acc:hover{filter:brightness(1.05);box-shadow:0 10px 30px -8px rgba(251,186,7,.8),0 0 0 1px rgba(255,255,255,.16) inset}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line-strong)}
  .btn.ghost:hover{background:rgba(255,255,255,.08)}
  .btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad);transition:background 140ms ease,color 140ms ease,transform 130ms var(--ease-out)}
  .btn.danger:hover{background:var(--bad);color:#1a0505}
  .del{border:1px solid var(--line-strong);background:rgba(255,255,255,.06);color:var(--muted);width:36px;height:36px;border-radius:8px;font-size:15px;cursor:pointer;flex:none;transition:border-color 140ms ease,color 140ms ease,transform 130ms var(--ease-out)}
  .del:hover{border-color:var(--bad);color:var(--bad);background:rgba(248,113,113,.1)}
  .del:active{transform:scale(.94)}
  .del.sm{width:30px;height:30px;font-size:13px;border-radius:7px}
  .iconbtn{transition:background 140ms ease,transform 130ms var(--ease-out)}
  .iconbtn:active{transform:scale(.96)}
  .stepper button{transition:background 120ms ease,transform 110ms var(--ease-out)}
  .stepper button:active{transform:scale(.9)}
  .btn.sm{padding:7px 11px;font-size:13px;border-radius:7px}
  .pill{display:inline-flex;align-items:center;gap:6px;font-family:"IBM Plex Mono";font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;border:1px solid var(--line-strong);background:rgba(255,255,255,.06)}
  .tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:2px 7px;border-radius:5px}
  .tag.stored{background:var(--ok-bg);color:var(--ok)} .tag.opened{background:var(--warn-bg);color:var(--warn)} .tag.empty{background:var(--bad-bg);color:var(--bad)}
  .emptystate{text-align:center;color:var(--muted);padding:48px 16px}
  .emptystate .big{font-size:40px;margin-bottom:8px}
  .spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .6s linear infinite;vertical-align:-3px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(12px);background:rgba(13,20,32,.9);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid rgba(255,255,255,.12);color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;z-index:80;box-shadow:0 10px 30px -10px #000;opacity:0;pointer-events:none;touch-action:pan-y;transition:opacity 200ms ease-out,transform 240ms var(--ease-out)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}

  /* page recede — the main content scales back and rounds off behind an open sheet */
  #page{transition:transform 400ms var(--ease-drawer);transform-origin:top center}
  body.modal-lock{overflow:hidden}
  body.modal-lock #page{transform:scale(.96);border-radius:16px;overflow:hidden}
  @media(prefers-reduced-motion:reduce){ body.modal-lock #page{transform:none} }
  .grid{display:grid;gap:12px}
  @media(min-width:620px){.grid.two{grid-template-columns:1fr 1fr}}
  .grid.tiles{grid-template-columns:repeat(auto-fill,minmax(148px,1fr))}

  /* quick nav (search landing) */
  .qsection{margin-top:26px}
  .qtile{display:flex;flex-direction:column;gap:7px;background:var(--panel);backdrop-filter:blur(var(--blur)) saturate(160%);-webkit-backdrop-filter:blur(var(--blur)) saturate(160%);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;text-decoration:none;color:inherit;box-shadow:var(--shadow);transition:transform 130ms var(--ease-out),border-color 140ms ease,box-shadow 140ms ease}
  .qtile:hover{border-color:rgba(251,186,7,.5);transform:translateY(-2px);box-shadow:var(--shadow),0 0 0 1px rgba(251,186,7,.18)}
  .qtile:active{transform:translateY(0) scale(.97)}
  .qtile-code{font-family:"IBM Plex Mono";font-weight:700;font-size:15px}
  .qtile-meta{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .deptchip{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.06);border:1px solid var(--line-strong);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;transition:background 140ms ease,transform 130ms var(--ease-out),border-color 140ms ease}
  .deptchip:hover{border-color:var(--accent);background:rgba(251,186,7,.12)}
  .deptchip:active{transform:scale(.95)}
  .deptchip .dc-name{color:var(--muted);font-weight:500}
  .qskel{background:linear-gradient(90deg,rgba(255,255,255,.05) 25%,rgba(255,255,255,.16) 37%,rgba(255,255,255,.05) 63%);background-size:400% 100%;animation:shimmer 1.4s ease infinite;border-radius:var(--r)}
  @keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}
  @keyframes fadeInUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  #app.fade-in{animation:fadeInUp 200ms var(--ease-out)}

  /* search */
  .searchbar{display:flex;gap:0;align-items:stretch;border:1px solid var(--line-strong);border-radius:14px;overflow:hidden;background:var(--panel);backdrop-filter:blur(var(--blur)) saturate(160%);-webkit-backdrop-filter:blur(var(--blur)) saturate(160%);box-shadow:var(--shadow);transition:border-color 160ms ease,box-shadow 160ms ease}
  .searchbar:focus-within{border-color:rgba(251,186,7,.55);box-shadow:var(--shadow),0 0 0 4px rgba(251,186,7,.16)}
  .searchbar input{flex:1;min-width:0;border:none;padding:16px 16px;font-size:17px;font-weight:500;background:transparent;color:var(--ink)}
  .searchbar input::placeholder{color:var(--muted)}
  .searchbar input:focus{outline:none}
  .searchbar button{border:none;flex:none;background:linear-gradient(135deg,#ffd873,var(--accent) 55%,var(--accent-2));color:var(--accent-ink);padding:0 20px;font-weight:700;cursor:pointer;font-size:15px}
  .searchrow{display:flex;gap:8px;align-items:stretch}
  .searchrow .searchbar{flex:1;min-width:0}
  .filtertoggle{position:relative;flex:none;gap:6px}
  .filtertoggle.active{background:rgba(251,186,7,.18);border-color:rgba(251,186,7,.5);color:var(--accent)}
  .fbadge{background:var(--accent);color:var(--accent-ink);font-family:"IBM Plex Mono";font-size:10px;font-weight:700;border-radius:999px;min-width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;padding:0 4px}
  .fchev{font-size:10px;transition:transform 200ms var(--ease-out)}
  #filterToggle[aria-expanded="true"] .fchev{transform:rotate(180deg)}
  .filterpanel{display:grid;grid-template-rows:0fr;transition:grid-template-rows 280ms var(--ease-out)}
  .filterpanel.open{grid-template-rows:1fr;margin-top:10px}
  .filterpanel .fpinner{overflow:hidden;min-height:0}
  .filterpanel .fpcard{padding:14px;background:var(--panel);backdrop-filter:blur(var(--blur)) saturate(160%);-webkit-backdrop-filter:blur(var(--blur)) saturate(160%);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
  .filterpanel .frow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .filterpanel .ffield{flex:1;min-width:130px}
  .filterpanel .ff{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
  select.t.sm,input.t.sm{padding:8px 10px;font-size:13px}
  .resbox{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel);backdrop-filter:blur(var(--blur)) saturate(160%);-webkit-backdrop-filter:blur(var(--blur)) saturate(160%);box-shadow:var(--shadow)}
  .resbox .hd{display:flex;align-items:center;gap:10px;padding:12px 14px;background:linear-gradient(135deg,var(--navy),#0a1e33);color:#fff;cursor:pointer;transition:transform 120ms var(--ease-out)}
  .resbox .hd:active{transform:scale(.985)}
  .resbox .hd .code{font-family:"IBM Plex Mono";font-weight:700;font-size:16px}
  .resbox .hd .zone{font-size:12px;color:#9fb4c0}
  .resrow{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line)}
  .resrow .qty{margin-left:auto;font-family:"IBM Plex Mono";font-weight:700}
  .thumb{position:relative;width:42px;height:42px;border-radius:7px;background:rgba(255,255,255,.08);border:1px solid var(--line);background-position:center;background-size:cover;flex:none;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:18px}
  .thumb .swatch{position:absolute;right:-3px;bottom:-3px;width:14px;height:14px;border-radius:50%;border:2px solid var(--bg);box-shadow:0 0 0 1px rgba(255,255,255,.2)}

  /* list cards */
  .lcard{display:flex;align-items:center;gap:14px;padding:14px 16px;text-decoration:none;transition:background 140ms ease,transform 120ms var(--ease-out)}
  .lcard:hover{background:rgba(255,255,255,.06)}
  .lcard:active{transform:scale(.985)}
  .lcard .code{font-family:"IBM Plex Mono";font-weight:700;font-size:17px}
  .lcard .meta{color:var(--muted);font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lcard .chev{margin-left:auto;color:var(--muted);font-size:20px}
  .divide>*+*{border-top:1px solid var(--line)}

  /* box detail */
  .boxhead{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
  .qrwrap{text-align:center}
  .qrwrap img{width:128px;height:128px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:6px}
  .itemrow{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:12px 0;border-radius:8px}
  .itemrow.saved-flash{animation:savedFlash 550ms ease}
  @keyframes savedFlash{0%{background:rgba(52,211,153,.16)}100%{background:transparent}}
  .stepper{display:inline-flex;align-items:center;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;background:rgba(255,255,255,.06)}
  .stepper button{border:none;background:transparent;color:var(--ink);width:36px;height:36px;font-size:18px;font-weight:700;cursor:pointer}
  .stepper button:hover{background:rgba(255,255,255,.1)}
  .stepper input{width:54px;border:none;border-left:1px solid var(--line);border-right:1px solid var(--line);background:transparent;color:var(--ink);text-align:center;font-family:"IBM Plex Mono";font-weight:700;height:36px}
  .stepper input:focus{outline:none}

  .dmodal .sheet{max-width:440px}
  @media(min-width:620px){.dmodal .sheet{border-radius:16px}}
  .dmodal .sbody{padding:20px 20px 4px}
  .dmodal .sfoot{gap:8px}
  .dfield{margin-bottom:16px}
  .dfield:last-child{margin-bottom:0}

  /* add-item modal */
  .modal{position:fixed;inset:0;z-index:60;background:rgba(4,8,14,.68);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;padding:0;opacity:0;pointer-events:none;transition:opacity 220ms ease-out}
  .modal.open{opacity:1;pointer-events:auto}
  @media(min-width:620px){.modal{align-items:center;padding:20px}}
  .sheet{background:rgba(13,20,32,.88);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);border:1px solid rgba(255,255,255,.1);color:var(--ink);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;box-shadow:0 -10px 50px -10px rgba(0,0,0,.6);transform:translateY(16px) scale(.985);opacity:0;transition:transform 360ms var(--ease-drawer),opacity 220ms ease-out}
  .modal.open .sheet{transform:none;opacity:1}
  .grabber{width:36px;height:5px;border-radius:999px;background:rgba(255,255,255,.28);margin:10px auto -2px;cursor:grab;touch-action:none;display:none}
  .grabber:active{cursor:grabbing;background:rgba(255,255,255,.45)}
  @media(max-width:619px){
    .grabber{display:block}
    .sheet{transform:translateY(100%);opacity:1;transition:transform 380ms var(--ease-drawer)}
    .modal.open .sheet{transform:translateY(0)}
  }
  .qrhint{font-size:12px;color:var(--muted);max-width:150px;margin:0 auto;line-height:1.4;border:1px dashed var(--line-strong);border-radius:8px;padding:10px}
  .scan-frame{position:absolute;inset:15% 22%;border:3px solid var(--accent);border-radius:16px;box-shadow:0 0 0 2000px rgba(0,0,0,.4);pointer-events:none}

  /* dashboard */
  .stat{text-align:center}
  .stat-n{font-family:"IBM Plex Sans Condensed";font-weight:700;font-size:32px;line-height:1}
  .stat-l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:6px}
  .dept-bar-row{display:grid;grid-template-columns:150px 1fr 44px;gap:10px;align-items:center;padding:9px 0}
  .dept-bar-row+.dept-bar-row{border-top:1px solid var(--line)}
  .dept-bar-label{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dept-bar-count{text-align:right;font-size:13px;color:var(--muted)}

  /* bulk box actions */
  .box-select{accent-color:var(--accent);width:18px;height:18px;flex:none;cursor:pointer}
  .bulkbar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(100px);opacity:0;pointer-events:none;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;background:rgba(13,20,32,.92);backdrop-filter:blur(var(--blur)) saturate(160%);-webkit-backdrop-filter:blur(var(--blur)) saturate(160%);border:1px solid var(--line-strong);border-radius:12px;padding:10px 14px;box-shadow:0 14px 40px -12px rgba(0,0,0,.6);z-index:70;transition:transform 260ms var(--ease-drawer),opacity 200ms ease-out;max-width:calc(100vw - 24px)}

/* ---------- colour-name → swatch ----------

const COLOR_BASE = {

function shadeHex(hex,pct){
  const n=parseInt(hex.slice(1),16);

/* ---------- offline write-queue ----------
   Scoped to the highest-frequency floor operations (qty edits, adding items, removing

   in a burst on patchy warehouse wifi. Queued in localStorage, replayed in order on
   reconnect; a header pill shows how many writes are still pending. */
const OFFLINE_KEY='ovs_offline_queue';
function loadQueue(){ try{return JSON.parse(localStorage.getItem(OFFLINE_KEY)||'[]');}catch(e){return [];} }
function saveQueue(q){ try{localStorage.setItem(OFFLINE_KEY,JSON.stringify(q));}catch(e){} updateOfflineBadge(); }
function queueWrite(type,payload){
  const q=loadQueue();
  q.push({id:(crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random())),type,payload,ts:Date.now()});
  saveQueue(q);
}
function updateOfflineBadge(){
  const n=loadQueue().length;
  const b=document.getElementById('offlineBadge');
  if(!b)return;
  b.hidden=n===0;

}
let flushingQueue=false;
async function flushQueue(){
  if(flushingQueue || !navigator.onLine || !client())return;
  flushingQueue=true;
  try{
    while(true){
      const q=loadQueue();
      if(!q.length)break;
      const entry=q[0];
      let error=null;
      try{
        if(entry.type==='qty'){
          ({error}=await client().from('items').update({qty:entry.payload.qty}).eq('id',entry.payload.id));
        }else if(entry.type==='add'){
          ({error}=await client().from('items').insert(entry.payload));
        }else if(entry.type==='delete'){
          ({error}=await client().from('items').delete().eq('id',entry.payload.id));
        }
      }catch(e){ error=e; }
      if(error)break; // still offline (or a real error) — leave it and the rest queued, stop for now
      const fresh=loadQueue();
      const idx=fresh.findIndex(x=>x.id===entry.id);
      if(idx>=0){ fresh.splice(idx,1); saveQueue(fresh); }
    }
  }finally{ flushingQueue=false; }
}
window.addEventListener('online',flushQueue);

// Staggered entrance for repeated list/grid items — skipped entirely under reduced-motion.
// Set as individual longhands, not the `animation` shorthand: assigning animation-delay
// separately right after a var()-containing shorthand string causes some browsers to
// silently drop the whole declaration (animation-name ends up empty, so nothing plays).
function staggerIn(container, selector, step=28, max=8){
  if(!container || reduceMotion()) return;
  container.querySelectorAll(selector).forEach((el,i)=>{
    el.style.animationName='fadeInUp';
    el.style.animationDuration='320ms';
    el.style.animationTimingFunction='var(--ease-out)';

}

    rowEl.style.marginTop='0'; rowEl.style.marginBottom='0';

}

// Deleting a shipment cascades departments (DB-level) and any directly-linked unboxed items,
// but boxes are explicitly deleted by this app (boxes.shipment_id is ON DELETE SET NULL, not
// CASCADE) which in turn cascades their items — so the snapshot has to gather all four.
async function deleteShipmentLogged(shipRow){
  const [{data:boxRows},{data:deptRows},{data:unboxedRows}]=await Promise.all([
    client().from('boxes').select('*').eq('shipment_id',shipRow.id),
    client().from('departments').select('*').eq('shipment_id',shipRow.id),
    client().from('items').select('*').eq('shipment_id',shipRow.id).is('box_id',null)
  ]);
  let boxedItems=[];
  if((boxRows||[]).length){
    const {data}=await client().from('items').select('*').in('box_id',boxRows.map(b=>b.id));
    boxedItems=data||[];
  }
  const items=[...boxedItems,...(unboxedRows||[])];
  await logActivity('shipment',`Deleted shipment "${shipRow.name}" (${(boxRows||[]).length} box(es), ${items.length} item line(s))`,{
    shipment:pick(shipRow,COLS.shipments),
    departments:(deptRows||[]).map(d=>pick(d,COLS.departments)),
    boxes:(boxRows||[]).map(b=>pick(b,COLS.boxes)),
    items:items.map(i=>pick(i,COLS.items))
  });
  if((boxRows||[]).length)await client().from('boxes').delete().in('id',boxRows.map(b=>b.id));
  return client().from('shipments').delete().eq('id',shipRow.id);
}
const baseUrl = ()=> location.origin+location.pathname;
// Base used for QR codes. Prefers the saved public URL; falls back to the
// current address only if it's a real http(s) origin (not file:// or a sandbox).
function appBase(){
  if(CFG.pubUrl) return CFG.pubUrl.replace(/\/+$/,'')+'/';
  const o=location.origin;
  if(o && o!=='null' && /^https?:$/.test(location.protocol)) return baseUrl();
  return '';
}

/* ---------- custom dialog helpers ---------- */
// Tracks how many sheets/dialogs are open so the page behind can recede (Vaul-style) and
// body scroll locks while any of them is up. Counted rather than boolean since dialogs
// can theoretically stack (e.g. a confirm on top of a form).
let openSheetCount=0;
function modalOpened(){
  openSheetCount++;
  document.body.classList.add('modal-lock');
}
function modalClosed(){
  openSheetCount=Math.max(0,openSheetCount-1);
  if(openSheetCount===0)document.body.classList.remove('modal-lock');
}
// Drag-to-dismiss for the mobile bottom sheet: 1:1 finger tracking while dragging down,
// rubber-band resistance dragging up, velocity- and distance-based release threshold.
function enableSheetDrag(overlay, sheetEl, onDismiss){
  const grabber=sheetEl.querySelector('.grabber');
  if(!grabber||reduceMotion())return;
  const isSheetMode=()=>matchMedia('(max-width:619px)').matches;
  let startY=0,startT=0,dy=0,dragging=false;
  grabber.addEventListener('pointerdown',e=>{
    if(!isSheetMode())return;
    dragging=true; startY=e.clientY; startT=Date.now(); dy=0;
    sheetEl.style.transition='none';
    try{ grabber.setPointerCapture?.(e.pointerId); }catch(err){}
  });
  grabber.addEventListener('pointermove',e=>{
    if(!dragging)return;
    dy=e.clientY-startY;
    if(dy<0)dy/=6; // rubber-band resistance when dragging past the open position
    sheetEl.style.transform=`translateY(${dy}px)`;
  });
  const release=()=>{
    if(!dragging)return; dragging=false;
    sheetEl.style.transition='';
    const velocity=dy/Math.max(1,Date.now()-startT);
    if(dy>90||velocity>0.5){
      sheetEl.style.transform='translateY(100%)';
      onDismiss();
    }else{
      sheetEl.style.transform='';
    }
  };
  grabber.addEventListener('pointerup',release);
  grabber.addEventListener('pointercancel',release);
}
function _dlgOverlay(content, narrow=true){
  const el=document.createElement('div');
  el.className='modal dmodal';
  el.innerHTML=`<div class="sheet"${narrow?' style="max-width:440px"':''}><div class="grabber"></div>${content}</div>`;
  document.body.appendChild(el);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{el.classList.add('open');modalOpened();}));
  return el;
}
function _dlgClose(el, val, resolve){
  el.classList.remove('open');
  modalClosed();
  setTimeout(()=>el.remove(),200);
  resolve(val);
}

/* ---------- camera barcode/QR scan ----------
   Shared camera lifecycle used by both "Go to box" (QR) and "Scan item" (1D barcode
   from a GRN-imported item) — zxing's MultiFormatReader decodes both, so one engine
   covers everything instead of depending on the inconsistently-supported native
   BarcodeDetector (especially for 1D formats on iOS Safari). */
let scannerControls=null;
function closeScanner(){
  const overlay=document.getElementById('scannerModal');
  overlay.classList.remove('open');
  modalClosed();
  if(scannerControls){ try{scannerControls.stop();}catch(e){} scannerControls=null; }
}
// openScanner(onResult, {continuous, title, hint}) opens the camera and calls
// onResult(rawText) on each successful decode. By default the scanner closes itself
// after the first result (used for "Go to box"); pass continuous:true to keep the
// camera running so onResult can be called repeatedly (used for scanning several
// items in a row) — the caller is then responsible for closing it (e.g. the ✕ button)
// and for ignoring re-entrant results while it's showing its own follow-up dialog.
// Returns true if the camera started, false if scanning isn't available/permitted —
// callers should fall back to manual entry in that case.
async function openScanner(onResult,{continuous=false,title='Scan box QR code',hint="Point your camera at the box's printed QR code."}={}){
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){
    toast('⚠ Camera scanning isn\'t supported in this browser — enter the code instead.');
    return false;
  }
  const overlay=document.getElementById('scannerModal');
  document.getElementById('scanTitle').textContent=title;
  document.getElementById('scanHint').textContent=hint;
  overlay.classList.add('open');
  modalOpened();
  const video=document.getElementById('scanVideo');
  const reader=new BrowserMultiFormatReader();
  try{
    scannerControls=await reader.decodeFromConstraints({video:{facingMode:'environment'}},video,(result)=>{
      if(!result)return;
      const raw=result.getText();
      if(!continuous)closeScanner();
      onResult(raw);
    });
    return true;
  }catch(e){
    toast('⚠ Camera access denied or unavailable — enter the code instead.');
    closeScanner();
    return false;
  }
}

};

async function doSearch(term){
  const res=$('#res'); if(!res)return;
  const filters={
    dept:$('#fltDept')?.value||'',
    gender:$('#fltGender')?.value||'',
    status:$('#fltStatus')?.value||'',
    shipment:$('#fltShipment')?.value||'',
    category:$('#fltCategory')?.value||''
  };
  const active=Object.values(filters).some(Boolean);
  if(!term && !active){res.innerHTML='';return;}
  res.innerHTML='<div class="emptystate">Searching…</div>';
  let query=client().from('item_search').select('*');
  if(term){
    const t=term.replace(/[,()%]/g,' ').trim();
    query=query.or(`style.ilike.%${t}%,sku.ilike.%${t}%,color.ilike.%${t}%,brand.ilike.%${t}%,department_code.ilike.%${t}%`);
  }
  if(filters.dept)query=query.eq('department_code',filters.dept);
  if(filters.gender)query=query.eq('gender',filters.gender);
  if(filters.status)query=query.eq('status',filters.status);
  if(filters.shipment)query=query.eq('shipment_name',filters.shipment);
  if(filters.category && CATEGORY_FILTERS[filters.category]){
    const c=CATEGORY_FILTERS[filters.category];
    query=query.ilike('style','%'+c.like+'%');
    (c.exclude||[]).forEach(x=>{ query=query.not('style','ilike','%'+x+'%'); });
  }
  const sortDef=SORTS[$('#fltSort')?.value]||SORTS.box;
  const {data,error}=await query.order(sortDef.col,{ascending:sortDef.asc}).limit(searchLimit);

  if(!data.length){res.innerHTML=`<div class="emptystate"><div class="big">∅</div>No items match${term?' “'+esc(term)+'”':' these filters'}.</div>`;return;}
  // group by box, preserving the sort order boxes first appear in
  const byBox={}; const order=[];
  data.forEach(r=>{
    if(!byBox[r.box_code]){byBox[r.box_code]={zone:r.zone,status:r.status,rows:[]};order.push(r.box_code);}
    byBox[r.box_code].rows.push(r);
  });
  const canLoadMore=data.length===searchLimit;
  res.innerHTML=order.map(code=>{const b=byBox[code];return `
    <div class="resbox" style="margin-bottom:12px">
      <div class="hd" onclick="location.hash='#/box/${encodeURIComponent(code)}'">
        <span class="code">${esc(code)}</span>

        <span style="margin-left:auto" class="tag ${b.status}">${esc(b.status)}</span>
      </div>
      ${b.rows.map(r=>`
        <div class="resrow">
          <div class="thumb" ${r.photo_url?`style="background-image:url(${esc(r.photo_url)})"`:''}>${r.photo_url?'':'👕'}${colorSwatchHtml(r.color)}</div>
          <div>
            <div style="font-weight:600">${esc(r.style)}${r.color?' · '+esc(r.color):''}</div>
            <div class="sub mono">${[r.sku,r.brand,r.gender,r.department_code?'Dept '+r.department_code:'',r.size?'size '+r.size:''].filter(Boolean).map(esc).join(' · ')||'—'}</div>
          </div>

let lastAssignBox='';
// Prompts the user to choose (or create) a box within a shipment. Returns the box id,
// or null if cancelled/failed. Shared by the "→ Box" button on unboxed items and the
// scan-to-assign flow below.
async function pickBoxForShipment(shipmentId,label){
  const [{data:boxes},{data:depts}]=await Promise.all([
    client().from('boxes').select('id,code,zone').eq('shipment_id',shipmentId).order('code'),
    client().from('departments').select('code,name').eq('shipment_id',shipmentId).order('code')
  ]);
  const opts=[{value:'',label:'— choose box —'},...(boxes||[]).map(b=>({value:b.code,label:b.code+(b.zone?' · '+b.zone:'')})),{value:'__new__',label:'➕ New box…'}];
  const r=await showDialog({title:`Assign "${label}"`,fields:[
    {id:'box',label:'Box',type:'select',value:lastAssignBox,options:opts}
  ],confirmLabel:'Assign'});
  if(!r)return null;
  let code=r.box;
  if(!code){toast('Pick a box');return null;}
  if(code==='__new__'){
    const deptOpts=[{value:'',label:'— Unassigned —'},...(depts||[]).map(d=>({value:d.code,label:`${d.code} — ${d.name}`}))];
    const r2=await showDialog({title:'New box',fields:[
      {id:'code',label:'Box code',placeholder:'e.g. B-0001',required:true,mono:true},
      {id:'zone',label:'Location / zone'},
      {id:'dept',label:'Department',type:'select',options:deptOpts}
    ],confirmLabel:'Create & assign'});
    if(!r2)return null;
    code=r2.code.trim();
    const {data:nb,error}=await client().from('boxes').insert({code,zone:r2.zone||null,shipment_id:shipmentId,department_code:r2.dept||null}).select('id').single();
    if(error){toast('⚠ '+error.message);return null;}
    lastAssignBox=code;
    return nb.id;
  }
  const {data:fb}=await client().from('boxes').select('id').eq('code',code).maybeSingle();
  if(!fb){toast('Box '+code+' not found');return null;}
  lastAssignBox=code;
  return fb.id;
}
// Assigns `qty` units of an unboxed item row to `boxId`. If qty covers everything left
// on the row, the row itself is moved; otherwise the row is split — its own qty is
// reduced and a new boxed row is inserted with the requested qty, leaving the rest
// unboxed for a later scan/assign.
async function assignItemQty(item,qty,boxId){
  qty=Math.max(1,Math.min(qty,item.qty));
  if(qty>=item.qty){
    const {error}=await client().from('items').update({box_id:boxId}).eq('id',item.id);
    if(error){toast('⚠ '+error.message);return false;}
  }else{
    const {error:e1}=await client().from('items').update({qty:item.qty-qty}).eq('id',item.id);
    if(e1){toast('⚠ '+e1.message);return false;}
    const {error:e2}=await client().from('items').insert({
      box_id:boxId,shipment_id:item.shipment_id,sku:item.sku,barcode:item.barcode||null,style:item.style,
      color:item.color||null,size:item.size||null,brand:item.brand||null,
      gender:item.gender||null,department_code:item.department_code||null,qty
    });
    if(e2){toast('⚠ '+e2.message);return false;}
  }
  return true;
}
// Scan-to-assign: opens the camera in continuous item-barcode mode, looks each scan up
// against unboxed items (from a GRN import), confirms a quantity, assigns it — straight
// into `box` if one's already open, otherwise via pickBoxForShipment — then keeps
// scanning so several items can be packed back-to-back. `box` and `shipmentId` are
// mutually exclusive; pass whichever context is known.
async function scanItems({box,shipmentId}={}){
  const sid=box?box.shipment_id:shipmentId;
  let busy=false;
  const ok=await openScanner(async raw=>{
    if(busy)return;
    busy=true;
    try{
      const code=raw.trim();
      if(!code)return;
      // Match the scanned value against the EAN/barcode first (that's what's physically
      // printed on the garment), then fall back to the OVS SKU so a scanned or typed SKU
      // still resolves.
      const lookup=async col=>{
        let q=client().from('items').select('*').is('box_id',null).eq(col,code);
        if(sid)q=q.eq('shipment_id',sid);
        const {data,error}=await q.limit(1);
        return {row:data&&data[0],error};
      };
      let {row:item,error}=await lookup('barcode');
      if(error){toast('⚠ '+error.message);return;}
      if(!item){({row:item,error}=await lookup('sku')); if(error){toast('⚠ '+error.message);return;}}
      if(!item){toast(`⚠ No unboxed item found for code "${code}"`);return;}
      const details=[item.sku&&('SKU '+item.sku),item.department_code&&('Dept '+item.department_code),item.size&&('Size '+item.size),item.color,item.brand].filter(Boolean).join(' · ');
      const r=await showDialog({title:item.style,fields:[
        {id:'qty',label:'Quantity to assign',type:'number',value:String(item.qty),required:true,hint:`${details} · ${item.qty} unboxed remaining`}
      ],confirmLabel:box?'Add to '+box.code:'Assign'});
      if(!r)return;
      const qty=Math.max(1,Math.min(parseInt(r.qty||'1',10)||1,item.qty));
      const boxId=box?box.id:await pickBoxForShipment(item.shipment_id,item.style);
      if(!boxId)return;
      const success=await assignItemQty(item,qty,boxId);
      if(success){
        toast(`✓ ${qty} × ${item.style} assigned`);
        if(box)viewBox(box.code);
      }
    }finally{ busy=false; }
  },{continuous:true,title:'Scan item barcode',hint:'Point your camera at the item\'s barcode. Keep scanning to add more.'});
  if(!ok)toast('Enter the item manually instead.');
}

function renderItems(box,items){
  const wrap=$('#items'); if(!wrap)return;
  if(!items.length){wrap.innerHTML='<div class="emptystate">No items yet — add the first.</div>';return;}
  wrap.innerHTML=items.map(i=>`
    <div class="itemrow" data-id="${i.id}">
      <div style="display:flex;gap:12px;align-items:center">
        <div class="thumb" ${i.photo_url?`style="background-image:url(${esc(i.photo_url)})"`:''}>${i.photo_url?'':'👕'}${colorSwatchHtml(i.color)}</div>
        <div>
          <div style="font-weight:600">${esc(i.style)}${i.color?' · '+esc(i.color):''}</div>
          <div class="sub mono">${[i.sku,i.brand,i.gender,i.department_code?'Dept '+i.department_code:'',i.size?'size '+i.size:''].filter(Boolean).map(esc).join(' · ')||'—'}</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <div class="stepper">
          <button data-d="-1">−</button>
          <input type="number" value="${i.qty}" data-qty>
          <button data-d="1">+</button>
        </div>
        <button class="del" data-del title="Remove item">🗑</button>
      </div>
    </div>`).join('');
  staggerIn(wrap,'.itemrow');
  wrap.querySelectorAll('.itemrow').forEach(rowEl=>{
    const id=rowEl.dataset.id;
    const input=rowEl.querySelector('[data-qty]');
    const save=async v=>{
      const n=Math.max(0,parseInt(v||0,10));input.value=n;
      let error=null;
      try{ ({error}=await client().from('items').update({qty:n}).eq('id',id)); }catch(e){ error=e; }
      if(error){ queueWrite('qty',{id,qty:n}); toast('Offline — saved locally · '+n); }
      else toast('Saved · '+n);
      rowEl.classList.remove('saved-flash'); void rowEl.offsetWidth; rowEl.classList.add('saved-flash');
      setTimeout(()=>rowEl.classList.remove('saved-flash'),550);
    };
    rowEl.querySelectorAll('button[data-d]').forEach(b=>b.onclick=()=>save(parseInt(input.value||0,10)+(+b.dataset.d)));
    input.onchange=()=>save(input.value);
    rowEl.querySelector('[data-del]').onclick=async()=>{
      const it=items.find(x=>x.id===id);
      const ok=await showConfirm({title:'Remove item?',message:`Remove "${it?it.style:'this item'}" from box ${box.code}?`,confirmLabel:'Remove',danger:true});
      if(!ok)return;
      if(it)await logActivity('item',`Removed "${it.style}" from box ${box.code}`,{item:pick(it,COLS.items)});
      let error=null;
      try{ ({error}=await client().from('items').delete().eq('id',id)); }catch(e){ error=e; }
      if(error){ queueWrite('delete',{id}); toast('Offline — will remove when back online'); }
      else toast('Item removed');
      collapseAndRemove(rowEl,()=>{
        const idx=items.findIndex(x=>x.id===id);
        if(idx>=0)items.splice(idx,1);
        const stats=$('#boxStats');
        if(stats)stats.textContent=`${items.reduce((a,i)=>a+(i.qty||0),0)} pieces · ${items.length} lines`;
        if(!items.length)wrap.innerHTML='<div class="emptystate">No items yet — add the first.</div>';
      });
    };
  });
}

function normGender(s){
  s=(s||'').toUpperCase();
  if(s.includes('BOY')) return 'Boys';
  if(s.includes('GIRL')) return 'Girls';
  if(s.includes('BABY')||s.includes('INFANT')||s.includes('NEWBORN')) return 'Baby';
  if(s.includes('KID')||s.includes('CHILD')||s.includes('JUNIOR')) return 'Kids';
  if(s.includes('LAD')||s.includes('WOMEN')||s.includes('WOMAN')||s.includes('FEMALE')) return 'Women';
  if(s.includes('MEN')||s.includes('MALE')||s.includes('GENT')) return 'Men';
  if(s.includes('UNISEX')) return 'Unisex';
  return s?s.charAt(0)+s.slice(1).toLowerCase():null;
}
// OVS spreadsheets encode many fields as "code ~ label" (e.g. Department "66 ~ Denim
// Woman", or an Options colour "1 ~ Medium Blue"). Split on the first "~"; when there's
// no "~", the whole value serves as both code and label.
function splitCodeLabel(v){
  const s=String(v??'').trim();
  if(!s)return {code:null,label:null};
  const i=s.indexOf('~');
  if(i<0)return {code:s,label:s};
  return {code:s.slice(0,i).trim()||null,label:s.slice(i+1).trim()||null};
}

let parsedRows=null;
async function handleFile(f){
  $('#fname').textContent=f.name+' — reading…';
  try{
    const buf=await f.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array'});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const grid=XLSX.utils.sheet_to_json(ws,{header:1,blankrows:false,defval:''});
    // Header detection: a header row needs a quantity column, a description/name column,
    // and at least one identifier column (sku / item code / ean / barcode / code). This
    // is more robust than the old ITEM+DESCRIPTION+QTY match, which could latch onto
    // unrelated "Item …" columns (e.g. "Item Composition") in real OVS GRN files.
    const isDescHdr=c=>c==='description'||c==='item description'||c==='item name'||c==='name'||(c.includes('descr')&&!c.includes('gender'));
    const isIdHdr=c=>c.includes('sku')||c==='item'||c==='item code'||c==='item no'||c==='item number'||(c.includes('item')&&c.includes('code'))||c==='code'||c.includes('ean')||c.includes('barcode')||c.includes('bar code')||c.includes('gtin')||c.includes('upc');
    const isQtyHdr=c=>c==='qty'||c.includes('quantity');
    let hi=-1;
    for(let i=0;i<Math.min(grid.length,40);i++){
      const cells=grid[i].map(c=>String(c).trim().toLowerCase());
      if(cells.some(isQtyHdr)&&cells.some(isDescHdr)&&cells.some(isIdHdr)){hi=i;break;}
    }
    if(hi<0)throw new Error('Could not find a header row with an item/SKU column, a description column and a quantity column.');
    const H=grid[hi].map(c=>String(c).trim().toLowerCase());
    const find=(preds)=>{for(const p of preds){const i=H.findIndex(h=>p(h));if(i>=0)return i;}return -1;};
    // Explicit, ordered mapping. Kept deliberately narrow so composition/customs/cost
    // columns are never mistaken for the item code.
    const skuCol   =find([h=>h==='sku'||h==='sku number'||h==='sku no',h=>h.includes('sku'),h=>h==='item code'||h==='item no'||h==='item number'||h==='itemcode',h=>h.includes('item')&&h.includes('code'),h=>h==='item',h=>h==='code']);
    const barcodeCol=find([h=>h==='ean'||h==='ean number'||h==='ean code',h=>h.includes('ean'),h=>h.includes('barcode')||h.includes('bar code'),h=>h==='gtin'||h==='upc']);
    const descCol  =find([h=>h==='item description',h=>h==='description',h=>h==='item name'||h==='name',h=>h.includes('descr')&&!h.includes('gender')&&!h.includes('cat')]);
    const genderCol=find([h=>h==='gender'||h==='gender description'||h==='gender desc',h=>h.includes('gender'),h=>h.includes('cat')]);
    const qtyCol   =find([h=>h==='qty',h=>h.includes('quantity')]);
    const deptCol  =find([h=>h==='dept'||h==='department',h=>h==='dept code'||h==='department code',h=>h.includes('dept')||h.includes('department')]);
    const sizeCol  =find([h=>h==='size',h=>h.includes('size')]);
    const colorCol =find([h=>h==='colour'||h==='color',h=>h.includes('colour')||h.includes('color')]);
    const brandCol =find([h=>h==='brand',h=>h.includes('brand')]);
    const rows=[];
    for(let i=hi+1;i<grid.length;i++){
      const r=grid[i];
      const sku=skuCol>=0?String(r[skuCol]??'').trim():'';
      const barcode=barcodeCol>=0?(String(r[barcodeCol]??'').trim()||null):null;
      const style=descCol>=0?String(r[descCol]??'').trim():'';
      // Need at least an identifier (sku or barcode) to import a row.
      if(!sku&&!barcode&&!style)continue;
      if(!sku&&!barcode)continue;
      const gender=genderCol>=0?normGender(String(r[genderCol]??'').trim()):null;
      const q=qtyCol>=0?Math.round(parseFloat(r[qtyCol])):NaN;
      const dept=deptCol>=0?splitCodeLabel(r[deptCol]):{code:null,label:null};
      const size=sizeCol>=0?(String(r[sizeCol]??'').trim()||null):null;
      const color=colorCol>=0?(splitCodeLabel(r[colorCol]).label||null):null;
      const brand=brandCol>=0?(String(r[brandCol]??'').trim()||null):null;
      rows.push({sku:sku||null,barcode,style:style||'(no description)',gender,qty:(isNaN(q)||q<=0)?1:q,department_code:dept.code,department_name:dept.label,size,color,brand});
    }
    parsedRows=rows;
    const pcs=rows.reduce((a,r)=>a+r.qty,0);
    $('#fname').textContent=f.name;
    if(!rows.length){$('#importBody').innerHTML='<div class="card pad sub">No item rows found below the header.</div>';return;}
    $('#importBody').innerHTML=`
      <div class="card pad">
        <div class="row" style="text-align:center">
          <div><div class="cond" style="font-size:28px;font-weight:700">${rows.length}</div><div class="sub">item lines</div></div>
          <div><div class="cond" style="font-size:28px;font-weight:700">${pcs}</div><div class="sub">pieces</div></div>
        </div>
        <div style="overflow:auto;margin:14px 0;max-height:300px">
          <table class="prev" style="min-width:760px"><thead><tr><th>sku</th><th>barcode</th><th>description</th><th>gender</th><th>dept</th><th>size</th><th>colour</th><th>brand</th><th>qty</th></tr></thead>
          <tbody>${rows.slice(0,15).map(r=>`<tr><td class="mono">${esc(r.sku||'')}</td><td class="mono">${esc(r.barcode||'')}</td><td>${esc(r.style)}</td><td>${esc(r.gender||'')}</td><td class="mono">${esc(r.department_code||'')}</td><td>${esc(r.size||'')}</td><td>${esc(r.color||'')}</td><td>${esc(r.brand||'')}</td><td class="mono">${r.qty}</td></tr>`).join('')}</tbody></table>
          ${rows.length>15?`<div class="sub" style="padding:8px">…and ${rows.length-15} more rows</div>`:''}
        </div>
        <div class="bar" id="bar" style="display:none;margin-bottom:10px"><i></i></div>
        <button class="btn acc" id="runImport" style="width:100%">Add ${rows.length} items to shipment</button>
      </div>`;
    $('#runImport').onclick=runImport;
  }catch(e){
    $('#fname').textContent=f.name;
    $('#importBody').innerHTML=`<div class="card pad" style="color:var(--bad)">⚠ ${esc(e.message||e)}</div>`;
  }
}
async function runImport(){
  if(!parsedRows||!parsedRows.length)return;
  const shipId=$('#shipSel').value;
  if(!shipId){toast('Choose a shipment first');$('#shipSel').focus();return;}
  const btn=$('#runImport'); btn.disabled=true; btn.innerHTML='<span class="spin"></span> Importing…';
  const bar=$('#bar'); bar.style.display='block'; const fill=bar.querySelector('i');
  try{
    // Auto-create any departments named in the GRN (code + label) that don't yet exist
    // on this shipment, so imported items group correctly on the shipment page.
    const deptMap=new Map();
    parsedRows.forEach(r=>{ if(r.department_code&&!deptMap.has(r.department_code))deptMap.set(r.department_code,r.department_name||r.department_code); });
    if(deptMap.size){
      const {data:exDepts}=await client().from('departments').select('code').eq('shipment_id',shipId);
      const have=new Set((exDepts||[]).map(d=>d.code));
      const newDepts=[...deptMap.entries()].filter(([code])=>!have.has(code)).map(([code,name])=>({code,name,shipment_id:shipId}));
      if(newDepts.length){ const {error:de}=await client().from('departments').insert(newDepts); if(de)throw de; }
    }
    // Skip rows already in the system, keyed by whichever identifier the row has
    // (barcode/EAN preferred, else SKU).
    const keyOf=r=>r.barcode||r.sku||null;
    const barcodes=parsedRows.map(r=>r.barcode).filter(Boolean);
    const skus=parsedRows.map(r=>r.sku).filter(Boolean);
    const existing=new Set();
    const collect=async(col,vals)=>{ for(let i=0;i<vals.length;i+=300){ const {data:ex}=await client().from('items').select(col).in(col,vals.slice(i,i+300)); (ex||[]).forEach(r=>existing.add(r[col])); } };
    if(barcodes.length)await collect('barcode',barcodes);
    if(skus.length)await collect('sku',skus);
    const all=parsedRows.map(r=>({shipment_id:shipId,box_id:null,sku:r.sku||null,barcode:r.barcode||null,style:r.style,gender:r.gender||null,qty:r.qty,department_code:r.department_code||null,size:r.size||null,color:r.color||null,brand:r.brand||null}));
    const items=all.filter(r=>{ const k=keyOf(r); return !k||!existing.has(k); });
    const skipped=all.length-items.length;
    const chunk=500;
    for(let i=0;i<items.length;i+=chunk){
      const {error}=await client().from('items').insert(items.slice(i,i+chunk));
      if(error)throw error;
      fill.style.width=Math.round((i+chunk)/Math.max(items.length,1)*100)+'%';
    }
    fill.style.width='100%';
    toast(`✓ Added ${items.length} items`+(skipped?` · ${skipped} already in system, skipped`:''));
    btn.innerHTML='✓ Done — open the shipment to box them';
    parsedRows=null;
  }catch(e){ toast('⚠ '+(e.message||e)); btn.disabled=false; btn.textContent='Retry import'; }
}
async function exportInventory(){
  const btn=$('#exportBtn'); if(!btn)return;
  const orig=btn.innerHTML; btn.disabled=true; btn.innerHTML='<span class="spin"></span> Exporting…';
  try{
    const {data,error}=await client().from('item_search').select('*').order('box_code');
    if(error)throw error;
    const rows=(data||[]).map(r=>({
      'Box':r.box_code, 'Location':r.zone||'', 'Box status':r.status||'', 'Shipment':r.shipment_name||'',
      'Style':r.style||'', 'SKU':r.sku||'', 'Brand':r.brand||'', 'Gender':r.gender||'',
      'Department':r.department_code||'', 'Colour':r.color||'', 'Size':r.size||'', 'Qty':r.qty||0
    }));
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Inventory');
    XLSX.writeFile(wb,`ovs-inventory-${new Date().toISOString().slice(0,10)}.xlsx`);
    toast(`Exported ${rows.length} item line(s)`);
  }catch(e){
    toast('⚠ '+(e.message||e));
  }finally{
    btn.disabled=false; btn.innerHTML=orig;
  }
}

/* ===================================================== DASHBOARD */
async function viewDashboard(){
  loading();
  const [{data:boxes},{data:items},{data:depts},{data:recentActivity}]=await Promise.all([
    client().from('boxes').select('id,zone,status,department_code'),
    client().from('items').select('qty,department_code'),
    client().from('departments').select('code,name'),
    client().from('activity_log').select('*').order('created_at',{ascending:false}).limit(5)
  ]);
  const totalBoxes=(boxes||[]).length;
  const totalPieces=(items||[]).reduce((a,i)=>a+(i.qty||0),0);
  const noLocation=(boxes||[]).filter(b=>!b.zone).length;
  const deptNameByCode={}; (depts||[]).forEach(d=>{ deptNameByCode[d.code]=d.name; });
  const deptCounts={};
  (items||[]).forEach(i=>{ if(i.department_code)deptCounts[i.department_code]=(deptCounts[i.department_code]||0)+(i.qty||0); });
  const deptRows=Object.entries(deptCounts).sort((a,b)=>b[1]-a[1]);
  const maxCount=deptRows.length?deptRows[0][1]:1;
  app.innerHTML=`
    <h1 class="page">Dashboard</h1>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr));margin-bottom:20px">
      <div class="card pad stat"><div class="stat-n">${totalBoxes}</div><div class="stat-l">Boxes</div></div>
      <div class="card pad stat"><div class="stat-n">${totalPieces}</div><div class="stat-l">Pieces</div></div>
      <div class="card pad stat"><div class="stat-n">${noLocation}</div><div class="stat-l">No location set</div></div>
      <div class="card pad stat"><div class="stat-n">${(depts||[]).length}</div><div class="stat-l">Departments</div></div>
    </div>
    <div class="sec-label" style="margin-top:0">Pieces by department</div>
    <div class="card pad" style="margin-bottom:20px">
      ${deptRows.length?deptRows.map(([code,count])=>`
        <div class="dept-bar-row">
          <div class="dept-bar-label"><span class="mono">${esc(code)}</span> ${esc(deptNameByCode[code]||'')}</div>
          <div class="bar"><i style="width:${Math.round(count/maxCount*100)}%"></i></div>
          <div class="dept-bar-count mono">${count}</div>
        </div>`).join(''):'<div class="sub">No department data yet.</div>'}
    </div>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
      <div class="sec-label" style="margin:0">Recent activity</div>
      <a class="sub" href="#/activity" style="margin-left:auto">View all →</a>
    </div>
    <div class="card divide">
      ${(recentActivity&&recentActivity.length)?recentActivity.map(a=>`
        <div class="lcard" style="cursor:default"><div style="flex:1;min-width:0">
          <div style="font-weight:600">${esc(a.summary)}</div>
          <div class="meta">${esc(new Date(a.created_at).toLocaleString())}</div>
        </div></div>`).join(''):'<div class="emptystate" style="padding:24px 16px">No activity yet.</div>'}
    </div>`;
  staggerIn(app,'.stat, .dept-bar-row, .lcard');
}

/* ===================================================== ACTIVITY (undo for deletes) */
async function viewActivity(){
  loading();
  const {data,error}=await client().from('activity_log').select('*').order('created_at',{ascending:false}).limit(50);
  if(error)return errView(error);
  app.innerHTML=`
    <h1 class="page">Activity</h1>
    <p class="sub" style="margin:-8px 2px 14px">Recent deletions. Restore brings back exactly what was removed.</p>
    ${data.length?`<div class="card divide">${data.map(a=>activityRowHtml(a)).join('')}</div>`
      :'<div class="emptystate"><div class="big">🕊</div>Nothing deleted yet.</div>'}`;
  staggerIn(app,'.lcard');
  app.querySelectorAll('[data-restore]').forEach(btn=>btn.onclick=()=>restoreActivity(btn.dataset.restore));
}
function activityRowHtml(a){
  const when=new Date(a.created_at).toLocaleString();
  return `<div class="lcard" style="cursor:default">
    <div style="flex:1;min-width:0">
      <div style="font-weight:600">${esc(a.summary)}</div>
      <div class="meta">${esc(when)}${a.restored_at?' · <span style="color:var(--ok)">restored</span>':''}</div>
    </div>
    ${a.restored_at?'':`<button class="btn ghost sm" data-restore="${a.id}" style="flex:none">↺ Restore</button>`}
  </div>`;
}
async function restoreActivity(logId){
  const {data:log,error}=await client().from('activity_log').select('*').eq('id',logId).single();
  if(error||!log)return toast('⚠ Could not load activity entry');
  if(log.restored_at)return toast('Already restored');
  const s=log.snapshot;
  let err=null;
  if(log.entity_type==='item'){
    ({error:err}=await client().from('items').insert(pick(s.item,COLS.items)));
  }else if(log.entity_type==='box'){
    ({error:err}=await client().from('boxes').insert(pick(s.box,COLS.boxes)));
    if(!err && (s.items||[]).length) ({error:err}=await client().from('items').insert(s.items.map(i=>pick(i,COLS.items))));
  }else if(log.entity_type==='shipment'){
    ({error:err}=await client().from('shipments').insert(pick(s.shipment,COLS.shipments)));
    if(!err && (s.departments||[]).length) ({error:err}=await client().from('departments').insert(s.departments.map(d=>pick(d,COLS.departments))));
    if(!err && (s.boxes||[]).length) ({error:err}=await client().from('boxes').insert(s.boxes.map(b=>pick(b,COLS.boxes))));
    if(!err && (s.items||[]).length) ({error:err}=await client().from('items').insert(s.items.map(i=>pick(i,COLS.items))));
  }else if(log.entity_type==='department'){
    ({error:err}=await client().from('departments').insert(pick(s.department,COLS.departments)));
    if(!err){
      if((s.boxIds||[]).length)await client().from('boxes').update({department_code:s.department.code}).in('id',s.boxIds);
      if((s.itemIds||[]).length)await client().from('items').update({department_code:s.department.code}).in('id',s.itemIds);
    }
  }
  if(err)return toast('⚠ Restore failed: '+err.message);
  await client().from('activity_log').update({restored_at:new Date().toISOString()}).eq('id',logId);
  toast('Restored'); viewActivity();
}

/* ===================================================== SETTINGS */
function viewSettings(forced){
  app.innerHTML=`
    <h1 class="page">${forced?'Connect your database':'Settings'}</h1>
    ${forced?'<p class="sub" style="margin-top:-8px">One-time setup. Paste your Supabase project URL and anon key. They\'re stored only in this browser.</p>':''}
    <div class="card pad" style="max-width:560px">
      <div style="margin-bottom:12px"><label class="f">Supabase URL</label>
        <input class="t mono" id="su" placeholder="https://xxxx.supabase.co" value="${esc(CFG.url)}"></div>
      <div style="margin-bottom:16px"><label class="f">Supabase anon key</label>
        <input class="t mono" id="sk" placeholder="eyJhbGci…" value="${esc(CFG.key)}"></div>
      <div style="margin-bottom:16px"><label class="f">Public app URL <span style="text-transform:none;font-weight:500">— for QR codes</span></label>
        <input class="t mono" id="pu" placeholder="https://ovs-inventory-xxxx.vercel.app" value="${esc(CFG.pubUrl)}">
        <div class="sticky-note">Paste your deployed address here so printed QR codes always open the live app. Leave blank to use the current address.</div></div>
      <button class="btn acc" id="saveCfg">Save & connect</button>
      ${!forced?'<button class="btn ghost" id="resetCfg" style="margin-left:8px">Disconnect</button>':''}
      <p class="sub" style="margin-bottom:0">Find the first two under Supabase → Project Settings → API.</p>
    </div>`;
  $('#saveCfg').onclick=()=>{
    const u=$('#su').value.trim().replace(/\/$/,''), k=$('#sk').value.trim();
    if(!u||!k)return toast('Enter both fields');
    CFG.set(u,k); CFG.setPub($('#pu').value.trim()); toast('Saved — reloading…'); setTimeout(()=>location.reload(),600);
  };
  const r=$('#resetCfg'); if(r)r.onclick=()=>{localStorage.clear();sb=null;location.hash='#/settings';location.reload();};
}

function errView(e){app.innerHTML=`<div class="emptystate"><div class="big">⚠</div>${esc(e.message||e)}<div class="sub" style="margin-top:8px">If this is your first run, check Settings and that schema.sql ran.</div></div>`;}
</script>
